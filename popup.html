<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fa;
    }
    * {
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      width: 380px;
      height: 580px;
      margin: 0;
      padding: 16px;
      overflow: hidden;
      background: #f4f6fa;
    }
    .app-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 2px 0 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-mark {
      display: block;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
    }
    .brand-copy h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .brand-copy p {
      margin: 3px 0 0;
      color: #748099;
      font-size: 11px;
    }
    .clear-button {
      display: grid;
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 0;
      border-radius: 6px;
      padding: 0;
      background: none;
      color: #66738d;
      cursor: pointer;
    }
    .clear-button:hover {
      background: #fff0f0;
      color: #a54141;
    }
    .clear-button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }
    .search-wrap {
      position: relative;
      margin-bottom: 10px;
      z-index: 2;
    }
    .search-icon {
      position: absolute;
      top: 9px;
      left: 11px;
      color: #8290a8;
      font-size: 13px;
      pointer-events: none;
    }
    #search-downloads {
      width: 100%;
      height: 34px;
      border: 1px solid #e0e5ee;
      border-radius: 9px;
      outline: none;
      padding: 0 42px 0 32px;
      background: #fff;
      color: #172033;
      font: inherit;
      font-size: 12px;
    }
    #search-downloads:focus,
    .filter-select:focus {
      border-color: #8da7f5;
      box-shadow: 0 0 0 2px #e6ecff;
    }
    .filter-toggle {
      position: absolute;
      top: 4px;
      right: 5px;
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border: 0;
      border-radius: 6px;
      padding: 0;
      background: transparent;
      color: #748099;
      cursor: pointer;
    }
    .filter-toggle:hover,
    .filter-toggle[aria-expanded="true"] {
      background: #edf2ff;
      color: #315bd6;
    }
    .filter-toggle svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }
    .filter-popup {
      position: absolute;
      top: calc(100% + 5px);
      right: 0;
      display: grid;
      width: 238px;
      gap: 9px;
      border: 1px solid #e0e5ee;
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(28, 43, 74, 0.14);
    }
    .filter-popup[hidden] {
      display: none;
    }
    .filter-field {
      display: grid;
      grid-template-columns: 64px 1fr;
      align-items: center;
      gap: 8px;
      color: #53617a;
      font-size: 11px;
    }
    .filter-select {
      width: 100%;
      height: 30px;
      border: 1px solid #e0e5ee;
      border-radius: 8px;
      outline: none;
      padding: 0 8px;
      background: #fff;
      color: #53617a;
      font: inherit;
      font-size: 11px;
    }
    .operation-message {
      min-height: 0;
      color: #37714a;
      font-size: 11px;
    }
    .operation-message:not(:empty) {
      margin: 0 0 8px;
    }
    .operation-message.error,
    .error-text {
      color: #b64242;
    }
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 1px 8px;
      color: #65728a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    #downloads-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 1px 4px 2px 1px;
      scrollbar-color: #cbd3e1 transparent;
      scrollbar-width: thin;
    }
    .download-card {
      margin-bottom: 9px;
      border: 1px solid #e8ebf1;
      border-radius: 11px;
      padding: 11px;
      background: #fff;
      box-shadow: 0 2px 5px rgba(28, 43, 74, 0.035);
    }
    .download-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .filename-group {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 8px;
    }
    .file-icon {
      display: grid;
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 8px;
      background: #f1f4fa;
      font-size: 16px;
    }
    .filename {
      min-width: 0;
      overflow: hidden;
      color: #202b40;
      font-size: 12px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status {
      flex: 0 0 auto;
      border-radius: 20px;
      padding: 4px 7px;
      background: #edf1f8;
      color: #5a6780;
      font-size: 9px;
      font-weight: 700;
    }
    .status-downloading,
    .status-resumed {
      background: #e9efff;
      color: #315bd6;
    }
    .status-completed {
      background: #e6f5eb;
      color: #2e7947;
    }
    .status-paused {
      background: #fff3dc;
      color: #8a6413;
    }
    .status-cancelled,
    .status-interrupted {
      background: #fdecec;
      color: #a54141;
    }
    .category-label {
      margin: 5px 0 0 38px;
      color: #8994a8;
      font-size: 10px;
    }
    progress {
      display: block;
      width: 100%;
      height: 5px;
      margin-top: 9px;
      accent-color: #4169e1;
    }
    .details {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      color: #748099;
      font-size: 10px;
    }
    .speed {
      color: #315bd6;
      font-weight: 650;
    }
    .time-remaining {
      margin-top: 5px;
      color: #748099;
      font-size: 10px;
    }
    .saved-location {
      margin-top: 6px;
      color: #8994a8;
      font-size: 10px;
      overflow-wrap: anywhere;
    }
    .file-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
    }
    .file-action {
      min-height: 25px;
      border: 1px solid #e0e6f0;
      border-radius: 6px;
      padding: 3px 8px;
      background: #fff;
      color: #53617a;
      font: inherit;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .file-action.icon-action {
      display: grid;
      width: 30px;
      height: 26px;
      place-items: center;
      padding: 4px;
    }
    .icon-action svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }
    .file-action:hover {
      border-color: #b8c7f5;
      background: #f7f8ff;
      color: #315bd6;
    }
    .file-action.primary-action {
      border-color: #315bd6;
      background: #315bd6;
      color: #fff;
    }
    .file-action.primary-action:hover {
      background: #244bbd;
    }
    .file-action.danger-action:hover {
      border-color: #e7b6b6;
      background: #fff6f6;
      color: #a54141;
    }
    .no-downloads {
      margin-top: 48px;
      color: #8994a8;
      font-size: 12px;
      text-align: center;
    }
    .downloads-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 auto;
      margin-top: 10px;
      border-top: 1px solid #e0e5ee;
      padding: 12px 2px 1px;
      color: #748099;
      font-size: 11px;
    }
    .copyright {
      font-size: 9px;
      white-space: nowrap;
    }
    .view-all-downloads {
      border: 0;
      padding: 3px 0 3px 8px;
      background: none;
      color: #315bd6;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    .view-all-downloads:hover,
    .file-action:hover {
      text-decoration: none;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid #7895f1;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img class="brand-mark" src="icons/icon2.png" alt="">
      <div class="brand-copy">
        <h1>DropMunk</h1>
        <p>Dropmunk - Manage your downloads smartly</p>
      </div>
    </div>
    <button id="clear-completed" class="clear-button" type="button" aria-label="Clear completed downloads" title="Clear completed downloads">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"></path></svg>
    </button>
  </header>

  <div class="search-wrap">
    <span class="search-icon" aria-hidden="true">⌕</span>
    <input id="search-downloads" type="search" aria-label="Search downloads" placeholder="Search files or source sites" autocomplete="off">
    <button id="toggle-filters" class="filter-toggle" type="button" aria-label="Show download filters" aria-expanded="false" aria-controls="filters-popup" title="Filter downloads">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6.2 7.1v5.2l-3.6 1.8v-7L4 5z"></path></svg>
    </button>
    <div id="filters-popup" class="filter-popup" hidden>
      <label class="filter-field">
        <span>Status</span>
        <select id="status-filter" class="filter-select" aria-label="Filter by status">
          <option value="all">All statuses</option>
          <option value="active">Downloading</option>
          <option value="paused">Paused</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
          <option value="interrupted">Interrupted</option>
        </select>
      </label>
      <label class="filter-field">
        <span>File type</span>
        <select id="category-filter" class="filter-select" aria-label="Filter by file type">
          <option value="all">All file types</option>
          <option value="documents">Documents</option>
          <option value="images">Images</option>
          <option value="video">Video</option>
          <option value="audio">Audio</option>
          <option value="archives">Archives</option>
          <option value="other">Other</option>
        </select>
      </label>
    </div>
  </div>

  <div id="operation-message" class="operation-message" role="status" aria-live="polite"></div>
  <div class="section-heading"><span>Recent activity</span></div>
  <main id="downloads-container">
    <div class="no-downloads">Loading downloads…</div>
  </main>

  <footer class="downloads-footer">
    <span class="copyright">Copyright &copy; <span id="copyright-year"></span> DropMunk. All rights reserved.</span>
    <button id="view-all-downloads" class="view-all-downloads" type="button">View all downloads →</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
